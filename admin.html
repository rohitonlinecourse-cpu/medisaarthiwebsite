<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediSaarthi Admin</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><div class="admin"><h1>MediSaarthi Orders</h1><p>Demo admin panel. Add authentication before production use.</p><table><tr><th>ID</th><th>Customer</th><th>Phone</th><th>Total</th><th>Status</th><th>Tracking</th></tr>{% for o in orders %}<tr><td>#{{o.id}}</td><td>{{o.name}}</td><td>{{o.phone}}</td><td>₹{{'%.2f'|format(o.total)}}</td><td><form class="statusForm" data-id="{{o.id}}"><select name="status">{% for s in statuses %}<option {% if s==o.status %}selected{% endif %}>{{s}}</option>{% endfor %}</select><button>Save</button></form></td><td><a href="/track/{{o.id}}">Track</a></td></tr>{% endfor %}</table></div><script>document.querySelectorAll('.statusForm').forEach(f=>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/admin/status/'+f.dataset.id,{method:'POST',body:new FormData(f)});if(r.ok) location.reload();});</script></body></html>
