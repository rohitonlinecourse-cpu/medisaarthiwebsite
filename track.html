<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order #{{order.id}} — MediSaarthi</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="trackPage"><div class="trackCard"><a href="/">← MediSaarthi Home</a><h1>Track Order #{{order.id}}</h1><p><b>{{order.name}}</b> · ₹{{'%.2f'|format(order.total)}} · {{order.created_at}}</p><div class="timeline">{% for s in statuses %}<div class="step {% if statuses.index(s) <= statuses.index(order.status) %}done{% endif %}"><span>{{loop.index}}</span><div><b>{{s}}</b>{% if s==order.status %}<small>Current status</small>{% endif %}</div></div>{% endfor %}</div><p class="help">For help: <a href="tel:{{contact}}">{{contact}}</a></p></div></body></html>
